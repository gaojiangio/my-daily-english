<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily English Learning</title>
    <style>
        /* 这里的样式保持你原来的不变 */
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; background: #fcfcfc; line-height: 1.6; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .english-text { font-size: 18px; color: #1a1a1a; margin-bottom: 15px; font-weight: 500; }
        .annotations { background: #f9f9f9; padding: 15px; border-radius: 8px; color: #444; font-size: 15px; }
    </style>
</head>
<body>
    <h1 style="text-align:center">My Daily English Hub</h1>

    <div class="card">
        <h3>Today's Feature News</h3>
        
        <div class="english-text">新闻正在加载中，请运行 Actions 脚本...</div>
        <div class="annotations">
            <p>重点词汇正在生成...</p>
        </div>
        <p style="margin-top:15px; font-size:12px; color: #999;">来源：China Daily</p>
    </div>
</body>
</html>
