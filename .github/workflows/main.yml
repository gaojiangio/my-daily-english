name: Daily News Auto Update

on:
  schedule:
    # 这个 cron 表达式代表每天北京时间早上 8:00 自动执行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 这个设置允许我们手动点击按钮来立即触发运行

jobs:
  run-daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 准备 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安装脚本需要的依赖
        run: pip install requests beautifulsoup4

      - name: 4. 执行爬虫脚本
        run: python main.py

      - name: 5. 将修改后的 HTML 提交回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto update: $(date)" || exit 0
          git push
